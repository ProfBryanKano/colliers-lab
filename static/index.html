<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colliers Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
<header class="cabecalho">
  <a class="marca" href="#inicio"><b>Colliers</b><span>Hub</span></a>
  <nav aria-label="Atalhos">
    <a href="#aprovacoes">Aprovações<span class="contador" id="nPend"></span></a>
    <a href="#mcp" class="opcional">Chamadas MCP</a>
    <a href="#conectar" class="opcional">Conectar um agente</a>
    <a href="/chat" target="_blank" class="opcional">Chat do lab</a>
  </nav>
</header>

<div class="estrutura">
  <nav class="menu" id="menu" aria-label="Módulos"></nav>
  <main class="palco" id="palco"></main>
  <aside class="atividade" aria-labelledby="t-atividade">
    <header><h2 id="t-atividade">Atividade ao vivo</h2><p>Cada chamada dos agentes aparece aqui no momento em que acontece.</p><a href="#mcp">Ver pedido e resposta de cada chamada MCP</a></header>
    <ol id="eventos" aria-live="polite"></ol>
  </aside>
</div>

<div class="fundo" id="fundo" hidden></div>
<section class="gaveta" id="gaveta" hidden aria-label="Registro"></section>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const brl = (v) => Number(v).toLocaleString("pt-BR", {style: "currency", currency: "BRL", maximumFractionDigits: 0});
const dataBR = (s) => s ? String(s).slice(0, 10).split("-").reverse().join("/") : "";
const quando = (s) => s ? `${dataBR(s)} às ${String(s).slice(11, 16)}` : "";
const lerSessao = (k) => { try { return sessionStorage.getItem(k) || ""; } catch (_) { return ""; } };
const gravarSessao = (k, v) => { try { sessionStorage.setItem(k, v); } catch (_) {} };

let S = null, est = {versao: 0}, ultimoEvento = 0, vista = "", filtroAprov = "pendente", vistos = {}, buscas = {}, gavetaAberta = "";

const OPS = {criar: "Criar", atualizar: "Alterar", excluir: "Excluir", enviar: "Enviar comunicação"};
const MODOS = {livre: "Livre", aprovacao: "Requer aprovação", bloqueado: "Bloqueado"};
const TIPOS = {leitura: "Leitura", escrita: "Escrita", pendente: "Aguarda aprovação", aprovacao: "Decisão humana", sistema: "Sistema", erro: "Recusado", bloqueado: "Bloqueado"};
const STATUS = {
  ok: ["Paga", "Concluído", "Concluída", "Enviada", "Ganha", "Vigente", "Respondida", "Encaminhada", "Acordo fechado", "aprovada", "Baixa"],
  espera: ["Em aberto", "Nova", "Aberto", "Pendente", "Em triagem", "Aguardando aprovação", "Em negociação", "Aguardando fornecedor", "Rascunho", "Em renovação", "Em atendimento", "pendente", "Alta", "Média", "Proposta", "Negociação", "Qualificação"],
  erro: ["Urgente", "Enviada ao jurídico", "rejeitada", "falhou"],
};
const classeStatus = (v) => Object.keys(STATUS).find((k) => STATUS[k].includes(v)) || "";
const ROTULOS = {imovel_id: "Imóvel", inicio: "Início", renovacao_automatica: "Renovação automática", indice_reajuste: "Índice de reajuste", numero: "Número",
  descricao: "Descrição", observacoes: "Observações", proximos_passos: "Próximos passos", proximo_passo: "Próximo passo", data_proximo_passo: "Data do próximo passo",
  ultimo_contato: "Último contato", endereco: "Endereço", conteudo: "Conteúdo", area: "Área", titulo: "Título", competencia: "Competência", cnpj: "CNPJ",
  empresa_id: "Empresa", oportunidade_id: "Oportunidade", contrato_id: "Contrato", colaborador_id: "Colaborador", responsavel_id: "Responsável",
  estagio: "Estágio", aberto_em: "Aberto em", recebida_em: "Recebida em", enviada_em: "Enviada em", relacionado_a: "Relacionado a", assinado_em: "Assinado em",
  dias_atraso: "Atraso", dias_para_vencimento: "Dias até o vencimento", dias_ate: "Dias até a data", hora: "Hora", corpo: "Texto", para: "Para", nome: "Nome",
  tipo: "Tipo", status: "Situação", prioridade: "Prioridade", categoria: "Categoria", canal: "Canal", assunto: "Assunto", mensagem: "Mensagem", remetente: "Remetente",
  cidade: "Cidade", setor: "Setor", cargo: "Cargo", email: "E-mail", telefone: "Telefone", principal: "Contato principal", unidade: "Unidade", resumo: "Resumo",
  valor: "Valor", vencimento: "Vencimento", data: "Data", origem: "Origem", classe: "Classe", texto: "Texto", solicitante: "Solicitante", fornecedor_id: "Fornecedor"};
const rotulo = (ent, c) => (S.entidades[ent].campos[c] || {}).rotulo || ROTULOS[c] || c.replace(/_id$/, "").replace(/_/g, " ").replace(/^./, (x) => x.toUpperCase());

function valor(ent, campo, reg, completo) {
  const def = S.entidades[ent].campos[campo];
  const v = reg[campo];
  if (v === null || v === undefined || v === "") return `<span class="apagado">—</span>`;
  if (!def) {
    if (campo === "dias_atraso") return v > 0 ? `<span class="st ${v > 60 ? "erro" : "espera"} num">${v} dias</span>` : `<span class="apagado">em dia</span>`;
    return `<span class="num">${esc(v)}</span>`;
  }
  switch (def.tipo) {
    case "moeda": return `<span class="num">${brl(v)}</span>`;
    case "numero": return `<span class="num">${Number(v).toLocaleString("pt-BR")}</span>`;
    case "data": return `<span class="num">${dataBR(v)}</span>`;
    case "booleano": return v ? "Sim" : "Não";
    case "ref": return completo ? `<a href="#m/${def.ref}/${esc(v)}">${esc(reg[campo + "_nome"] || v)}</a> <small>${esc(v)}</small>` : `${esc(reg[campo + "_nome"] || v)}`;
    case "opcao": return ["status", "prioridade", "estagio"].includes(campo) ? `<span class="st ${classeStatus(v)}">${esc(v)}</span>` : esc(v);
    case "texto_longo": return completo ? `<pre class="documento">${esc(v)}</pre>` : `<span class="duas-linhas">${esc(v)}</span>`;
    default: return esc(v);
  }
}

async function api(url, corpo) {
  const r = await fetch(url, corpo ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corpo)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.detail || "Não foi possível concluir."), {status: r.status});
  return j;
}

/* menu */
function desenharMenu() {
  const rota = location.hash.slice(1) || "inicio";
  const item = (r, nome, extra = "") => `<a href="#${r}" ${rota === r || rota.startsWith(r + "/") ? 'aria-current="page"' : ""}>${nome}${extra}</a>`;
  const grupos = {};
  Object.entries(S.entidades).forEach(([k, e]) => (grupos[e.grupo] = grupos[e.grupo] || []).push([k, e]));
  $("#menu").innerHTML = item("inicio", "Visão geral") + item("mcp", "Chamadas MCP") +
    Object.entries(grupos).map(([g, ents]) => `<h4>${esc(g)}</h4>` + ents.map(([k, e]) => item("m/" + k, esc(e.nome), `<span class="qtd">${e.total}</span>`)).join("")).join("") +
    `<h4>Governança</h4>` + item("aprovacoes", "Aprovações", `<span class="qtd ${est.pendentes ? "atencao" : ""}">${est.pendentes || ""}</span>`) +
    item("politicas", "Políticas") + item("auditoria", "Auditoria") + item("conectar", "Conectar um agente");
  $("#nPend").textContent = est.pendentes || "";
}

function topo(trilha, titulo, desc, extra = "") {
  return `<div class="topo-pagina"><div class="trilha">${trilha}</div><h1>${esc(titulo)}</h1>${desc ? `<p class="desc">${desc}</p>` : ""}${extra}</div>`;
}

async function rotear(forcar) {
  const rota = location.hash.slice(1) || "inicio";
  const [base, ent, id] = rota.split("/");
  const chave = base === "m" ? "m/" + ent : base;
  desenharMenu();
  if (chave !== vista || forcar) {
    vista = chave;
    try {
      if (base === "m" && S.entidades[ent]) await telaModulo(ent);
      else if (base === "aprovacoes") await telaAprovacoes();
      else if (base === "politicas") telaPoliticas();
      else if (base === "auditoria") await telaAuditoria();
      else if (base === "conectar") telaConectar();
      else if (base === "mcp") await telaMCP();
      else await telaInicio();
    } catch (e) { $("#palco").innerHTML = topo("Erro", "Não foi possível carregar esta página", esc(e.message) + ". Recarregue a página; se continuar, veja os logs do serviço no Render."); }
  }
  if (base === "m" && id) abrirRegistro(ent, id); else fecharRegistro(false);
}

/* visão geral */
async function telaInicio() {
  const [dem, chm, cob, ctr, apr] = await Promise.all(["demandas", "chamados", "cobrancas", "contratos"].map((e) => api("/api/registros/" + e)).concat(api("/api/aprovacoes?status=pendente")));
  const novas = dem.registros.filter((d) => d.status === "Nova").length;
  const criticos = chm.registros.filter((c) => c.status !== "Concluído" && ["Urgente", "Alta"].includes(c.prioridade)).length;
  const atraso = cob.registros.filter((c) => c.dias_atraso > 0);
  const vencendo = ctr.registros.filter((c) => c.status !== "Encerrado" && c.dias_para_vencimento >= 0 && c.dias_para_vencimento <= 180).length;
  $("#palco").innerHTML = `<section class="faixa-marinho"><h1>A operação imobiliária onde os agentes trabalham.</h1>
      <p>CRM, carteira de contratos, cobrança, manutenção e caixa de entrada num só lugar, com dados fictícios. Os agentes consultam e alteram tudo pelo MCP; o que é sensível espera uma pessoa aprovar.</p></section>
    <div class="indicadores">
      <a href="#aprovacoes"><strong class="${apr.length ? "alerta" : ""}">${apr.length}</strong><span>pedidos esperando aprovação</span></a>
      <a href="#m/demandas"><strong>${novas}</strong><span>demandas novas na caixa de entrada</span></a>
      <a href="#m/chamados"><strong class="${criticos ? "alerta" : ""}">${criticos}</strong><span>chamados urgentes ou altos em aberto</span></a>
      <a href="#m/cobrancas"><strong>${brl(atraso.reduce((s, c) => s + c.valor, 0))}</strong><span>em aluguéis atrasados (${atraso.length} cobranças)</span></a>
      <a href="#m/contratos"><strong>${vencendo}</strong><span>contratos vencendo em 180 dias, pelo cadastro</span></a>
    </div>
    <div class="corpo"><h2 style="margin-bottom:14px">Quem decide cada escrita</h2>
      <div class="modos">
        <div><h3>Livre</h3><p>O agente faz e a mudança aparece na hora. Por exemplo, registrar uma reunião ou triar uma demanda.</p></div>
        <div><h3>Requer aprovação</h3><p>O pedido vai para a fila e nada muda até alguém aprovar com o token. Por exemplo, enviar um e-mail ou alterar um contrato.</p></div>
        <div><h3>Bloqueado</h3><p>O servidor recusa, diga o prompt o que disser. Por exemplo, excluir um contrato.</p></div>
        <div><h3>Campo sensível</h3><p>Num módulo livre, alguns campos ainda pedem aprovação, como o responsável de uma oportunidade.</p></div>
      </div>
      <p class="apagado" style="margin-top:16px">As regras de cada módulo ficam em <a href="#politicas">Políticas</a> e podem mudar durante a aula.</p></div>`;
}

/* módulo */
async function telaModulo(ent) {
  const e = S.entidades[ent];
  const busca = buscas[ent] || "";
  const d = await api(`/api/registros/${ent}` + (busca ? `?busca=${encodeURIComponent(busca)}` : ""));
  const antes = vistos[ent], agora = {};
  d.registros.forEach((r) => (agora[r.id] = r.atualizado_em));
  const cols = [...e.colunas, ...(e.virtuais.includes("dias_atraso") ? ["dias_atraso"] : [])];
  const regras = `<div class="regras"><span>Criar: <b>${MODOS[e.politica.criar]}</b></span><span>Alterar: <b>${MODOS[e.politica.atualizar]}</b></span><span>Excluir: <b>${MODOS[e.politica.excluir]}</b></span>${e.sensiveis.length ? `<span>Campos sensíveis: <b>${e.sensiveis.map((c) => esc(rotulo(ent, c))).join(", ")}</b></span>` : ""}</div>`;
  const focado = document.activeElement && document.activeElement.id === "busca";
  $("#palco").innerHTML = topo(`${esc(e.grupo)} / ${esc(e.nome)}`, e.nome, esc(e.descricao), regras) +
    `<div class="corpo"><div class="painel"><div class="barra-lista"><span class="apagado">${d.total} ${d.total === 1 ? "registro" : "registros"}</span>
      <input id="busca" type="search" placeholder="Buscar em ${esc(e.nome.toLowerCase())}" value="${esc(busca)}" aria-label="Buscar"></div>` +
    (d.registros.length ? `<div class="rolagem"><table><thead><tr><th>Código</th>${cols.map((c) => `<th>${esc(rotulo(ent, c))}</th>`).join("")}</tr></thead><tbody>` +
      d.registros.map((r) => `<tr class="abre ${antes && antes[r.id] !== r.atualizado_em ? "novo" : ""}" data-abrir="${ent}/${r.id}"><td><span class="id">${esc(r.id)}</span></td>${cols.map((c) => `<td>${valor(ent, c, r)}</td>`).join("")}</tr>`).join("") +
      `</tbody></table></div>` : `<p class="vazio" style="border:0">Nada encontrado${busca ? ` para “${esc(busca)}”` : ""}.</p>`) + `</div></div>`;
  vistos[ent] = agora;
  if (focado) { const i = $("#busca"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

/* registro */
async function abrirRegistro(ent, id) {
  gavetaAberta = ent + "/" + id;
  let d;
  try { d = await api(`/api/registro/${ent}/${id}`); }
  catch (_) {
    $("#gaveta").innerHTML = `<div class="gaveta-topo"><h2>${esc(id)}</h2><button data-fechar>Fechar</button></div><div class="gaveta-corpo"><p class="vazio">Este registro não existe mais. Ele pode ter sido excluído.</p></div>`;
    $("#gaveta").hidden = $("#fundo").hidden = false; return;
  }
  const e = S.entidades[ent], r = d.registro;
  const ficha = Object.keys(e.campos).map((c) => `<dt>${esc(rotulo(ent, c))}${e.sensiveis.includes(c) ? `<span class="sens" title="Alterar este campo pede aprovação">sensível</span>` : ""}</dt><dd>${valor(ent, c, r, true)}</dd>`).join("") +
    e.virtuais.map((c) => `<dt>${esc(rotulo(ent, c))}</dt><dd>${valor(ent, c, r, true)} <small>calculado</small></dd>`).join("");
  const ligados = Object.entries(d.relacionados).map(([k, lista]) => `<h3>${esc(S.entidades[k].nome)}</h3><ul class="ligados">${lista.map((x) => `<li><a href="#m/${k}/${x.id}"><span class="id">${x.id}</span></a> ${esc(x.titulo)}</li>`).join("")}</ul>`).join("");
  const hist = d.historico.map((h) => `<li>${esc(OPS[h.operacao] || h.operacao)} por ${esc(h.autor)}, via ${esc(h.origem)}, em ${quando(h.quando)}${h.aprovacao_id ? `, aprovado no pedido ${h.aprovacao_id}` : ""}</li>`).join("");
  $("#gaveta").innerHTML = `<div class="gaveta-topo"><div><small>${esc(e.nome)} ${esc(r.id)}</small><h2>${esc(r[e.titulo] || r.id)}</h2></div><button data-fechar>Fechar</button></div>
    <div class="gaveta-corpo">
      ${d.aprovacoes_pendentes.length ? `<div class="aviso">Há ${d.aprovacoes_pendentes.length === 1 ? "um pedido" : d.aprovacoes_pendentes.length + " pedidos"} de alteração esperando aprovação. <a href="#aprovacoes">Ver na fila</a></div>` : ""}
      <dl class="ficha">${ficha}</dl>
      <p class="apagado" style="margin-top:10px;font-size:13px">Última alteração por ${esc(r.atualizado_por)} em ${quando(r.atualizado_em)}.</p>
      ${ligados ? `<h2 style="margin-top:28px">Registros ligados</h2>${ligados}` : ""}
      ${hist ? `<h2 style="margin-top:28px">Histórico</h2><ul class="historico" style="padding-left:18px">${hist}</ul>` : ""}
    </div>`;
  $("#gaveta").hidden = $("#fundo").hidden = false;
}
function fecharRegistro(mudarEndereco = true) {
  if ($("#gaveta").hidden) return;
  $("#gaveta").hidden = $("#fundo").hidden = true; gavetaAberta = "";
  if (mudarEndereco) { const [b, ent] = location.hash.slice(1).split("/"); if (b === "m") history.replaceState(null, "", "#m/" + ent); }
}

/* aprovações */
const comNome = (a, v) => v !== null && v !== undefined && a.nomes && a.nomes[v] ? `${a.nomes[v]} (${v})` : v;
function oQueMuda(a) {
  const ent = a.entidade;
  if (a.operacao === "atualizar") return `<table><thead><tr><th>Campo</th><th>Hoje</th><th>Depois de aprovar</th></tr></thead><tbody>` +
    Object.keys(a.dados || {}).map((c) => `<tr><td>${esc(rotulo(ent, c))}</td><td class="antes">${esc(comNome(a, (a.antes || {})[c]) ?? "vazio")}</td><td class="depois">${esc(comNome(a, a.dados[c]) ?? "vazio")}</td></tr>`).join("") + `</tbody></table>`;
  if (a.operacao === "criar") return `<table><thead><tr><th>Campo</th><th>Valor do novo registro</th></tr></thead><tbody>` +
    Object.entries(a.dados || {}).filter(([, v]) => v !== null && v !== "").map(([c, v]) => `<tr><td>${esc(rotulo(ent, c))}</td><td class="depois" style="white-space:pre-wrap">${esc(comNome(a, v))}</td></tr>`).join("") + `</tbody></table>`;
  if (a.operacao === "excluir") return `<table><thead><tr><th>Campo</th><th>Registro que será apagado</th></tr></thead><tbody>` +
    Object.entries(a.antes || {}).filter(([k, v]) => k !== "id" && v !== null && v !== "").slice(0, 12).map(([c, v]) => `<tr><td>${esc(rotulo(ent, c))}</td><td class="antes">${esc(String(comNome(a, v)).slice(0, 300))}</td></tr>`).join("") + `</tbody></table>`;
  return "";
}
const mensagens = {};
async function telaAprovacoes() {
  const lista = await api("/api/aprovacoes" + (filtroAprov === "pendente" ? "?status=pendente" : ""));
  const mostrar = filtroAprov === "pendente" ? lista : lista.filter((a) => a.status !== "pendente");
  await Promise.all(mostrar.filter((a) => a.operacao === "enviar" && !mensagens[a.registro_id]).map(async (a) => {
    try { mensagens[a.registro_id] = (await api(`/api/registro/comunicacoes/${a.registro_id}`)).registro; } catch (_) {}
  }));
  const aprovador = lerSessao("aprovador");
  const cartao = (a) => {
    const m = a.operacao === "enviar" ? mensagens[a.registro_id] : null;
    const alvo = a.registro_id ? `<a href="#m/${a.entidade}/${a.registro_id}">${esc(a.registro_id)}</a>` : "novo registro";
    const decisao = a.status === "pendente"
      ? `<label for="c${a.id}" style="font-weight:600;font-size:14px">Comentário para o agente</label><textarea id="c${a.id}" data-comentario="${a.id}" placeholder="Opcional. O agente lê isto ao consultar o pedido."></textarea>
         <div class="acoes"><button data-decidir="${a.id}" data-aprovar="1">Aprovar</button><button class="recusar" data-decidir="${a.id}" data-aprovar="0">Rejeitar</button></div>
         <small>Aprovar executa a operação exatamente como mostrada.</small>`
      : `<div class="decidido"><strong><span class="st ${classeStatus(a.status)}">${a.status === "aprovada" ? "Aprovado" : a.status === "falhou" ? "Aprovado, mas falhou" : "Rejeitado"}</span></strong>por ${esc(a.decidido_por)} em ${quando(a.decidido_em)}${a.comentario ? `<p style="margin-top:8px">“${esc(a.comentario)}”</p>` : ""}</div>`;
    return `<article class="pedido ${a.status}"><div class="pedido-conteudo">
        <small>Pedido ${a.id}, ${esc(OPS[a.operacao] || a.operacao).toLowerCase()} em ${esc(a.entidade_nome)}, ${alvo}</small>
        <h2>${esc(a.titulo || a.registro_id || "Novo registro")}</h2>
        <p class="contexto">Pedido por <b>${esc(a.autor)}</b> via ${esc(a.origem)} em ${quando(a.criado_em)}. Motivo da revisão: ${esc(a.motivo_aprovacao)}.</p>
        ${a.justificativa ? `<p class="porque"><b>Justificativa do agente:</b> ${esc(a.justificativa)}</p>` : ""}
        ${m ? `<div class="mensagem"><header>Para <b>${esc(m.para)}</b><br>Assunto: <b>${esc(m.assunto)}</b></header><pre>${esc(m.corpo)}</pre></div>` : oQueMuda(a)}
      </div><div class="decidir">${decisao}</div></article>`;
  };
  $("#palco").innerHTML = topo("Governança / Aprovações", "Aprovações", "Tudo o que os agentes pediram e que a política não deixa fazer sozinho. Rejeitar não muda nada, e o agente recebe o seu comentário.") +
    `<div class="corpo"><div style="display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:20px">
      <div class="filtros" style="margin:0"><button data-filtro="pendente" aria-pressed="${filtroAprov === "pendente"}">Esperando decisão</button><button data-filtro="decididas" aria-pressed="${filtroAprov !== "pendente"}">Já decididos</button></div>
      <span class="apagado">Decidindo como <b style="color:var(--tinta)">${esc(aprovador || "nome não informado")}</b>. <button class="link" id="trocarNome">Trocar nome</button></span></div>` +
    (mostrar.length ? mostrar.map(cartao).join("") : `<p class="vazio">${filtroAprov === "pendente" ? "Nenhum pedido esperando. Quando um agente tentar algo sensível, ele aparece aqui." : "Nenhum pedido foi decidido ainda."}</p>`) + `</div>`;
}

/* políticas */
function telaPoliticas() {
  const sel = (ent, op, v) => `<select data-pol="${ent}" data-op="${op}" data-modo="${v}" aria-label="${op} em ${ent}">${S.modos.map((m) => `<option value="${m}" ${m === v ? "selected" : ""}>${MODOS[m]}</option>`).join("")}</select>`;
  const sens = (ent, e) => `<details><summary>${e.sensiveis.length ? e.sensiveis.map((c) => esc(rotulo(ent, c))).join(", ") : "Nenhum"}</summary><div class="campos-sens">${Object.keys(e.campos).filter((c) => !e.campos[c].sistema).map((c) => `<label><input type="checkbox" data-sens="${ent}" value="${c}" ${e.sensiveis.includes(c) ? "checked" : ""}>${esc(rotulo(ent, c))}</label>`).join("")}</div></details>`;
  $("#palco").innerHTML = topo("Governança / Políticas", "Políticas", "O servidor aplica estas regras em toda chamada, venha do Claude, do ChatGPT, do chat do lab ou de código. Mudar uma regra exige o token de administrador e vale na hora.") +
    `<div class="corpo"><div class="painel rolagem politicas"><table><thead><tr><th>Módulo</th><th>Criar</th><th>Alterar</th><th>Excluir</th><th>Campos sensíveis</th></tr></thead><tbody>` +
    Object.entries(S.entidades).map(([k, e]) => `<tr><td><b style="font-weight:600">${esc(e.nome)}</b><span class="sub">${esc(e.grupo)}</span></td><td>${sel(k, "criar", e.politica.criar)}</td><td>${sel(k, "atualizar", e.politica.atualizar)}</td><td>${sel(k, "excluir", e.politica.excluir)}</td><td>${sens(k, e)}</td></tr>`).join("") +
    `</tbody></table></div>
    <div class="painel politicas" style="margin-top:28px"><table><thead><tr><th>Ação externa</th><th>Regra</th></tr></thead><tbody><tr><td><b style="font-weight:600">Enviar comunicação</b><span class="sub">E-mails, cartas e notificações para fora da Colliers</span></td>
      <td><select data-acao="enviar_comunicacao" data-modo="${S.acoes.enviar_comunicacao}">${S.modos.map((m) => `<option value="${m}" ${m === S.acoes.enviar_comunicacao ? "selected" : ""}>${MODOS[m]}</option>`).join("")}</select></td></tr></tbody></table></div>
    <p style="margin-top:20px"><button class="contorno" id="restaurar">Voltar às regras padrão</button></p></div>`;
}

/* auditoria */
async function telaAuditoria() {
  const lista = await api("/api/auditoria");
  const mudanca = (a) => {
    if (a.operacao === "criar") return "Registro criado";
    if (a.operacao === "excluir") return "Registro excluído";
    const antes = a.antes ? JSON.parse(a.antes) : {}, depois = a.depois ? JSON.parse(a.depois) : {};
    return Object.keys(depois).filter((k) => JSON.stringify(antes[k]) !== JSON.stringify(depois[k])).map((k) => `${rotulo(a.entidade, k)}: ${String(antes[k] ?? "vazio").slice(0, 40)} → ${String(depois[k] ?? "vazio").slice(0, 40)}`).join("; ");
  };
  $("#palco").innerHTML = topo("Governança / Auditoria", "Auditoria", "Cada escrita que de fato aconteceu, com quem pediu, por onde e qual aprovação a liberou.") +
    `<div class="corpo">` + (lista.length ? `<div class="painel rolagem"><table><thead><tr><th>Quando</th><th>Operação</th><th>Registro</th><th>Autor</th><th>Origem</th><th>Aprovação</th><th>O que mudou</th></tr></thead><tbody>` +
      lista.map((a) => `<tr><td class="num">${quando(a.quando)}</td><td>${esc(OPS[a.operacao] || a.operacao)}</td><td><a class="id" href="#m/${a.entidade}/${a.registro_id}">${esc(a.registro_id)}</a></td><td>${esc(a.autor)}</td><td>${esc(a.origem)}</td><td class="num">${a.aprovacao_id ? "Pedido " + a.aprovacao_id : "—"}</td><td><span class="duas-linhas">${esc(mudanca(a))}</span></td></tr>`).join("") +
      `</tbody></table></div>` : `<p class="vazio">Nenhuma escrita ainda. Assim que um agente alterar algo, ela aparece aqui.</p>`) + `</div>`;
}

/* conectar */
function telaConectar() {
  const ferramentas = [["descrever_plataforma", "Leitura", "Mostra os módulos, os campos e as regras de cada um"], ["listar", "Leitura", "Lista registros com filtros, busca e ordenação"],
    ["ler", "Leitura", "Abre um registro e o que está ligado a ele"], ["buscar", "Leitura", "Procura um texto em todos os módulos"], ["consultar_aprovacao", "Leitura", "Mostra a decisão sobre um pedido"],
    ["criar", "Escrita", "Cria um registro"], ["atualizar", "Escrita", "Altera campos de um registro"], ["excluir", "Escrita destrutiva", "Exclui um registro"], ["enviar_comunicacao", "Escrita", "Envia um rascunho de e-mail ou carta"]];
  $("#palco").innerHTML = topo("Conectar um agente", "Conectar um agente", "Qualquer assistente compatível com MCP enxerga as ferramentas do Hub só com o endereço abaixo.") +
    `<div class="corpo"><div class="painel" style="padding:24px 26px">
      <h2>Endereço do MCP</h2><p style="margin:12px 0 4px"><code style="font-size:15px;padding:10px 14px;display:inline-block;word-break:break-all">${esc(est.mcp_url)}</code> <button class="contorno" id="copiar" style="margin-left:6px">Copiar</button></p>
      <p class="apagado">Sem autenticação: use apenas com os dados fictícios do lab.</p>
      <h3 style="margin-top:24px">Claude</h3><p>Configurações, Conectores, Adicionar conector personalizado. Cole o endereço e salve.</p>
      <h3 style="margin-top:16px">ChatGPT</h3><p>Ative o modo desenvolvedor nas configurações e crie um conector com o endereço. Em contas corporativas, o administrador precisa liberar conectores personalizados.</p>
      <h3 style="margin-top:16px">Sem conector</h3><p>Use o <a href="/chat" target="_blank">chat do lab</a>: ele chama as mesmas ferramentas e traz seis modelos de agente prontos.</p></div>
    <div class="painel" style="margin-top:28px"><table><thead><tr><th>Ferramenta</th><th>Tipo</th><th>O que faz</th></tr></thead><tbody>${ferramentas.map((f) => `<tr><td><code>${f[0]}</code></td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join("")}</tbody></table></div>
    <div class="painel" style="margin-top:28px;padding:24px 26px"><h2>Instrutor</h2><p style="margin:8px 0 14px" class="apagado">Recria todos os módulos com os dados iniciais, com datas a partir de hoje. As regras de Políticas continuam como estão.</p>
      <button class="recusar" id="reiniciar">Reiniciar os dados</button></div></div>`;
}

/* chamadas MCP: pedido e resposta de cada tools/call */
let mcpUltimo = 0, mcpPausado = false, mcpNovas = [], mcpFiltro = "", mcpAbertas = new Set();
const ORIGENS = {"MCP": "Assistente via MCP", "Chat do lab": "Chat do lab", "Painel de aprovação": "Painel"};
function jsonBonito(v) {
  const t = esc(JSON.stringify(v, null, 2));
  return t.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?\b)/g, (m, str, dois, bool, num) => {
    if (str) return dois ? `<span class="k">${str}</span>${dois}` : `<span class="s">${str}</span>`;
    if (bool) return `<span class="b">${bool}</span>`;
    return `<span class="n">${num}</span>`;
  });
}
const resumoArgs = (a) => Object.entries(a || {}).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join("  ");
function htmlChamada(c, nova) {
  const pedido = {jsonrpc: "2.0", id: c.id, method: "tools/call", params: {name: c.ferramenta, arguments: c.argumentos}};
  const resposta = {jsonrpc: "2.0", id: c.id, result: {content: [{type: "text", text: "(o mesmo conteúdo, como texto)"}], structuredContent: c.resultado, isError: c.situacao === "erro"}};
  const sit = {ok: ["ok", "Concluída"], pendente: ["espera", "Foi para aprovação"], erro: ["erro", "Recusada"]}[c.situacao] || ["", c.situacao];
  const quem = (c.cliente && c.origem === "MCP" ? c.cliente : ORIGENS[c.origem] || c.origem);
  return `<details class="chamada ${nova ? "nova" : ""}" data-chamada="${c.id}" ${mcpAbertas.has(c.id) ? "open" : ""}>
    <summary><span class="num apagado">${esc(c.quando.slice(11, 19))}</span><span class="so-largo">${esc(quem)}</span><span class="ferr">${esc(c.ferramenta)}</span>
      <span class="resumo-args so-largo">${esc(resumoArgs(c.argumentos))}</span><span class="st ${sit[0]}">${sit[1]}</span><span class="ms so-largo">${c.duracao_ms} ms</span></summary>
    <div class="par"><div><h3>Pedido do assistente</h3><p class="apagado">O modelo escolheu a ferramenta e preencheu os argumentos.</p><pre class="json">${jsonBonito(pedido)}</pre></div>
      <div><h3>Resposta do Hub</h3><p class="apagado">É isto que o modelo lê para decidir o próximo passo.</p><pre class="json">${jsonBonito(resposta)}</pre></div></div></details>`;
}
async function telaMCP() {
  const d = await api("/api/chamadas?limite=80");
  mcpUltimo = d.ultimo; mcpNovas = [];
  if (!mcpAbertas.size && d.chamadas[0]) mcpAbertas.add(d.chamadas[0].id);
  const lista = d.chamadas.filter((c) => !mcpFiltro || c.origem === mcpFiltro);
  $("#palco").innerHTML = topo("Por dentro / Chamadas MCP", "Chamadas MCP",
    "Cada vez que um assistente usa o Hub, ele manda um pedido <code>tools/call</code> com a ferramenta e os argumentos que o modelo escolheu, e recebe a resposta que vai ler em seguida. Abra uma chamada para ver as duas mensagens.") +
    `<div class="corpo"><div class="controles">
      <div class="filtros" style="margin:0"><button data-mcp-modo="vivo" aria-pressed="${!mcpPausado}">Ao vivo</button><button data-mcp-modo="pausa" aria-pressed="${mcpPausado}">Pausado</button></div>
      <label class="apagado">Mostrar <select id="mcpFiltro"><option value="">todas as origens</option>${Object.entries(ORIGENS).map(([k, v]) => `<option value="${k}" ${k === mcpFiltro ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <button class="contorno" id="verTools">Ver o que o agente enxerga (tools/list)</button>
      <span class="apagado" id="mcpAviso"></span></div>
      <div id="toolsList"></div>
      <div id="listaMCP">${lista.length ? lista.map((c) => htmlChamada(c)).join("") : `<p class="vazio" id="mcpVazio">Nenhuma chamada ainda. Conecte um assistente ao endereço em <a href="#conectar">Conectar um agente</a> ou use o <a href="/chat" target="_blank">chat do lab</a>; cada chamada aparece aqui na hora.</p>`}</div></div>`;
}
async function puxarMCP() {
  if (vista !== "mcp") return;
  try {
    const d = await api(`/api/chamadas?apos=${mcpUltimo}`);
    if (!d.chamadas.length) return;
    mcpUltimo = d.ultimo;
    const novas = d.chamadas.filter((c) => !mcpFiltro || c.origem === mcpFiltro);
    if (mcpPausado) { mcpNovas = novas.concat(mcpNovas); $("#mcpAviso").textContent = `${mcpNovas.length} chamada(s) nova(s) esperando. Clique em Ao vivo para ver.`; return; }
    inserirChamadas(novas);
  } catch (_) {}
}
function inserirChamadas(novas) {
  const alvo = $("#listaMCP"); if (!alvo || !novas.length) return;
  const vazio = $("#mcpVazio"); if (vazio) vazio.remove();
  mcpAbertas.clear(); mcpAbertas.add(novas[0].id);
  alvo.querySelectorAll("details.chamada[open]").forEach((d) => d.removeAttribute("open"));
  alvo.insertAdjacentHTML("afterbegin", novas.map((c) => htmlChamada(c, true)).join(""));
  while (alvo.children.length > 120) alvo.lastElementChild.remove();
}
async function mostrarTools() {
  const alvo = $("#toolsList");
  if (alvo.innerHTML) { alvo.innerHTML = ""; return; }
  const lista = (await api("/api/mcp/ferramentas")).map((t) => ({...t, description: (t.description || "").replace(/\s+/g, " ").trim()}));
  alvo.innerHTML = `<div class="painel" style="margin-bottom:24px"><div class="barra-lista"><span><b style="font-weight:600;color:var(--marinho)">Resposta de tools/list</b> <span class="apagado">É assim que o assistente descobre as ${lista.length} ferramentas: nome, descrição, parâmetros e marcas de leitura ou escrita.</span></span></div>` +
    lista.map((t) => `<details class="ferramenta-def"><summary><span class="ferr" style="font:600 14px ui-monospace,Menlo,monospace;color:var(--marinho)">${esc(t.name)}</span> <span class="apagado">${t.annotations && t.annotations.readOnlyHint ? "somente leitura" : t.annotations && t.annotations.destructiveHint ? "escrita destrutiva" : "escrita"}</span></summary>
      <p>${esc(t.description)}</p><pre class="json" style="margin:10px 0 4px">${jsonBonito({name: t.name, description: t.description, inputSchema: t.inputSchema, annotations: t.annotations})}</pre></details>`).join("") + `</div>`;
}

/* atividade */
async function puxarAtividade() {
  try {
    const j = await api(`/api/feed?apos=${ultimoEvento}`);
    const lista = $("#eventos");
    if (j.ultimo && j.ultimo < ultimoEvento) { lista.innerHTML = ""; ultimoEvento = 0; return puxarAtividade(); }
    j.eventos.reverse().forEach((e) => {
      const li = document.createElement("li");
      li.className = e.tipo + (ultimoEvento ? " chegou" : "");
      const alvo = e.entidade && e.registro_id ? ` <a href="#m/${esc(e.entidade)}/${esc(e.registro_id)}">${esc(e.registro_id)}</a>` : "";
      li.innerHTML = `<div class="linha1"><span><b>${esc(TIPOS[e.tipo] || e.tipo)}</b> ${esc(e.ferramenta)}${alvo}</span><span class="num">${esc(e.quando.slice(11, 19))}</span></div>
        <p>${esc(e.resumo)}</p><div class="quem">${e.autor ? esc(e.autor) + ", " : ""}${esc(e.origem)}</div>`;
      lista.prepend(li);
    });
    while (lista.children.length > 150) lista.lastChild.remove();
    ultimoEvento = j.ultimo || ultimoEvento;
  } catch (_) {}
}

async function atualizar() {
  try {
    const e = await api("/api/estado");
    const mudou = e.versao !== est.versao;
    est = e;
    if (mudou) {
      S = await api("/api/schema");
      const ocupado = document.activeElement && document.activeElement.matches("textarea, select, input[type=checkbox]");
      if (!ocupado && vista !== "mcp") await rotear(true); else desenharMenu();
      if (gavetaAberta) { const [ent, id] = gavetaAberta.split("/"); abrirRegistro(ent, id); }
    }
  } catch (_) {}
  puxarAtividade();
}

/* ações */
async function comToken(tipo, acao) {
  const chave = tipo === "admin" ? "tokenAdmin" : "tokenAprovador";
  let t = lerSessao(chave);
  if (!t) { t = prompt(tipo === "admin" ? "Token de administrador" : "Token de aprovação"); if (!t) return false; gravarSessao(chave, t.trim()); t = t.trim(); }
  try { await acao(t); return true; }
  catch (e) { if (e.status === 403) { gravarSessao(chave, ""); alert("Token incorreto. Tente de novo."); } else alert(e.message); return false; }
  finally { await atualizar(); }
}

document.addEventListener("click", async (ev) => {
  const t = ev.target;
  const linha = t.closest("[data-abrir]");
  if (linha && !t.closest("a")) { location.hash = "m/" + linha.dataset.abrir; return; }
  if (t.closest("[data-fechar]") || t.id === "fundo") { fecharRegistro(); return; }
  const modo = t.closest("[data-mcp-modo]");
  if (modo) {
    mcpPausado = modo.dataset.mcpModo === "pausa";
    document.querySelectorAll("[data-mcp-modo]").forEach((b) => b.setAttribute("aria-pressed", b === modo));
    if (!mcpPausado && mcpNovas.length) { inserirChamadas(mcpNovas); mcpNovas = []; $("#mcpAviso").textContent = ""; }
    return;
  }
  if (t.id === "verTools") { mostrarTools(); return; }
  const f = t.closest("[data-filtro]");
  if (f) { filtroAprov = f.dataset.filtro; telaAprovacoes(); return; }
  if (t.id === "trocarNome") { const n = prompt("Seu nome, para registrar quem decidiu", lerSessao("aprovador")); if (n && n.trim()) gravarSessao("aprovador", n.trim()); telaAprovacoes(); return; }
  const dec = t.closest("[data-decidir]");
  if (dec) {
    if (!lerSessao("aprovador")) { const n = prompt("Seu nome, para registrar quem decidiu"); if (!n || !n.trim()) return; gravarSessao("aprovador", n.trim()); }
    const comentario = (document.querySelector(`[data-comentario="${dec.dataset.decidir}"]`) || {}).value || "";
    dec.disabled = true;
    await comToken("aprovador", async (tk) => {
      const r = await api(`/api/aprovacoes/${dec.dataset.decidir}`, {token: tk, aprovar: dec.dataset.aprovar === "1", comentario, por: lerSessao("aprovador")});
      if (r.status === "falhou") alert("A operação não pôde ser executada: " + r.erro);
    });
    dec.disabled = false; vista = ""; rotear(true); return;
  }
  if (t.id === "restaurar") { await comToken("admin", (tk) => api("/api/politicas", {token: tk, restaurar: true})); vista = ""; rotear(true); return; }
  if (t.id === "reiniciar") {
    if (!confirm("Apagar tudo o que os agentes fizeram e recriar os dados iniciais?")) return;
    if (await comToken("admin", (tk) => api("/api/reiniciar", {token: tk}))) { $("#eventos").innerHTML = ""; ultimoEvento = 0; vistos = {}; vista = ""; rotear(true); }
    return;
  }
  if (t.id === "copiar") { navigator.clipboard.writeText(est.mcp_url).catch(() => {}); t.textContent = "Copiado"; setTimeout(() => (t.textContent = "Copiar"), 1500); }
});

document.addEventListener("toggle", (ev) => {
  const d = ev.target;
  if (d.dataset && d.dataset.chamada) { const id = Number(d.dataset.chamada); if (d.open) mcpAbertas.add(id); else mcpAbertas.delete(id); }
}, true);

document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.id === "mcpFiltro") { mcpFiltro = t.value; telaMCP(); return; }
  if (!t.dataset.pol && !t.dataset.acao && !t.dataset.sens) return;
  if (t.dataset.pol) await comToken("admin", (tk) => api("/api/politicas", {token: tk, entidade: t.dataset.pol, operacao: t.dataset.op, modo: t.value}));
  else if (t.dataset.acao) await comToken("admin", (tk) => api("/api/politicas", {token: tk, acao: t.dataset.acao, modo: t.value}));
  else {
    const marcados = [...document.querySelectorAll(`[data-sens="${t.dataset.sens}"]:checked`)].map((x) => x.value);
    await comToken("admin", (tk) => api("/api/politicas", {token: tk, entidade: t.dataset.sens, sensiveis: marcados}));
  }
  t.blur(); vista = ""; rotear(true);
});

let espera;
document.addEventListener("input", (ev) => {
  if (ev.target.id !== "busca") return;
  const ent = location.hash.slice(1).split("/")[1];
  buscas[ent] = ev.target.value;
  clearTimeout(espera); espera = setTimeout(() => telaModulo(ent), 250);
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") fecharRegistro(); });
window.addEventListener("hashchange", () => rotear(false));

(async function iniciar() {
  try {
    est = await api("/api/estado");
    S = await api("/api/schema");
  } catch (e) {
    $("#palco").innerHTML = topo("Erro", "O Hub não respondeu", "O servidor pode estar iniciando. Espere alguns segundos e recarregue a página.");
    setTimeout(iniciar, 4000); return;
  }
  await rotear(true);
  puxarAtividade();
  setInterval(atualizar, 3000);
  setInterval(puxarMCP, 1500);
})();
</script>
</body>
</html>

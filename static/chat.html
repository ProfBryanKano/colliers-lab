<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat do lab · Colliers Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/estilo.css">
<style>
  .chat { display: grid; grid-template-columns: 380px minmax(0, 1fr); min-height: calc(100vh - 64px); }
  .ajustes { background: #fff; border-right: 1px solid var(--linha); padding: 28px 28px 40px; display: flex; flex-direction: column; gap: 18px; }
  .ajustes label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; color: var(--marinho); }
  .ajustes .ajuda { font-weight: 400; font-size: 13px; color: var(--ardosia); }
  .ajustes textarea { min-height: 300px; resize: vertical; font-size: 13.5px; }
  .conversa { display: flex; flex-direction: column; min-width: 0; height: calc(100vh - 64px); }
  .mensagens { flex: 1; overflow-y: auto; padding: 32px 40px; display: flex; flex-direction: column; gap: 18px; }
  .boas-vindas h1 { margin-bottom: 10px; }
  .boas-vindas p { color: var(--ardosia); max-width: 64ch; }
  .msg { max-width: 760px; }
  .msg.eu { align-self: flex-end; background: var(--marinho); color: #fff; padding: 12px 16px; }
  .msg.agente { background: #fff; border: 1px solid var(--linha); padding: 16px 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.falha { background: #fdf0f2; border-left: 3px solid var(--erro); padding: 12px 16px; }
  .msg.trabalhando { color: var(--ardosia); }
  .passos { background: #fff; border: 1px solid var(--linha); }
  .passos summary { padding: 10px 16px; cursor: pointer; font-size: 14px; color: var(--azul); font-weight: 600; }
  .passo { border-top: 1px solid var(--linha); padding: 10px 16px; font-size: 14px; }
  .passo pre { white-space: pre-wrap; word-break: break-word; background: var(--nevoa); padding: 10px; margin: 6px 0 0; max-height: 240px; overflow: auto; font-size: 12.5px; }
  .passo details summary { padding: 4px 0 0; font-weight: 400; font-size: 13px; }
  .sugestoes { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 40px 14px; }
  .sugestoes button { background: #fff; color: var(--marinho); border-color: var(--linha-forte); font-weight: 400; text-align: left; font-size: 14px; }
  .sugestoes button:hover { border-color: var(--azul); background: #fff; color: var(--azul); }
  .entrada { display: flex; gap: 10px; padding: 16px 40px 22px; border-top: 1px solid var(--linha); background: #fff; }
  .entrada textarea { flex: 1; min-height: 52px; resize: vertical; }
  @media (max-width: 900px) {
    .chat { grid-template-columns: 1fr; }
    .ajustes { border-right: 0; border-bottom: 1px solid var(--linha); padding: 20px 16px; }
    .ajustes textarea { min-height: 160px; }
    .conversa { height: auto; min-height: 70vh; }
    .mensagens, .sugestoes, .entrada { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header class="cabecalho">
  <a class="marca" href="/"><b>Colliers</b><span>Chat do lab</span></a>
  <nav aria-label="Atalhos"><a href="/" target="_blank">Abrir o Hub</a></nav>
</header>

<div class="chat">
  <aside class="ajustes">
    <label>Nome do grupo<input id="nome" maxlength="60" placeholder="Por exemplo, Grupo 3"><span class="ajuda">Aparece como autor na atividade, nas aprovações e na auditoria.</span></label>
    <label>Modelo<select id="modelo"></select></label>
    <label>Agente<select id="agente"><option value="">Sem instruções</option></select><span class="ajuda">Escolha um agente pronto ou escreva as instruções abaixo.</span></label>
    <label>Instruções<textarea id="instrucoes" placeholder="Vazio, o agente só conhece as ferramentas. Um bom roteiro: papel, objetivo, regras, ferramentas, saída e limites."></textarea><span class="ajuda">Valem a partir da próxima mensagem.</span></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="nova" type="button">Nova conversa</button><button id="apagar" class="contorno" type="button">Apagar instruções</button></div>
  </aside>

  <section class="conversa" aria-label="Conversa">
    <div class="mensagens" id="mensagens" aria-live="polite">
      <div class="boas-vindas"><h1>Peça algo à operação.</h1><p>O agente usa as mesmas ferramentas MCP do Hub. Abra os passos de cada resposta para ver o que ele consultou e alterou. O que for sensível vai para a fila de Aprovações.</p></div>
    </div>
    <div class="sugestoes" id="sugestoes"></div>
    <form class="entrada" id="form">
      <textarea id="texto" placeholder="Escreva um pedido" aria-label="Mensagem" required></textarea>
      <button type="submit" id="enviar">Enviar</button>
    </form>
  </section>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const ler = (k) => { try { return sessionStorage.getItem(k) || ""; } catch (_) { return ""; } };
const guardar = (k, v) => { try { sessionStorage.setItem(k, v); } catch (_) {} };
const TIPO = {leitura: "Leitura", escrita: "Escrita", pendente: "Aguarda aprovação"};
let historico = [], AGENTES = [];
const GERAIS = ["O que esta plataforma tem e o que eu posso fazer em cada módulo?", "Quais cobranças estão com mais de 60 dias de atraso?", "Quais oportunidades estão sem responsável?"];

["nome", "instrucoes"].forEach((id) => { $("#" + id).value = ler(id); $("#" + id).addEventListener("input", (e) => guardar(id, e.target.value)); });

function sugestoes() {
  const a = AGENTES.find((x) => x.id === $("#agente").value);
  const lista = a ? [a.exemplo, GERAIS[0]] : GERAIS;
  $("#sugestoes").innerHTML = lista.map((t) => `<button type="button">${esc(t)}</button>`).join("");
}

fetch("/api/chat/config").then((r) => r.json()).then((c) => {
  $("#modelo").innerHTML = c.modelos.map((m) => `<option>${esc(m)}</option>`).join("");
  if (c.modelos.includes(ler("modelo"))) $("#modelo").value = ler("modelo");
  AGENTES = c.agentes || [];
  $("#agente").innerHTML += AGENTES.map((a) => `<option value="${esc(a.id)}">${esc(a.nome)}</option>`).join("");
  $("#agente").value = ler("agente");
  sugestoes();
  if (!c.habilitado) adicionar("falha", "O chat está desligado porque o servidor não tem a variável OPENROUTER_API_KEY. Configure-a no Render, em Environment, e o serviço reinicia sozinho.");
}).catch(() => adicionar("falha", "Não foi possível falar com o servidor. Recarregue a página."));

$("#modelo").addEventListener("change", (e) => guardar("modelo", e.target.value));
$("#agente").addEventListener("change", async (e) => {
  guardar("agente", e.target.value);
  const a = AGENTES.find((x) => x.id === e.target.value);
  const t = a ? await (await fetch("/static/agentes/" + a.arquivo)).text() : "";
  $("#instrucoes").value = t; guardar("instrucoes", t); sugestoes();
});

function adicionar(tipo, html) {
  const d = document.createElement("div");
  d.className = "msg " + tipo; d.innerHTML = html;
  $("#mensagens").append(d); $("#mensagens").scrollTop = $("#mensagens").scrollHeight;
  return d;
}

async function enviar(texto) {
  if (!$("#nome").value.trim()) { $("#nome").focus(); adicionar("falha", "Preencha o nome do grupo antes de enviar. Ele identifica vocês no Hub."); return; }
  historico.push({role: "user", content: texto});
  adicionar("eu", esc(texto));
  const espera = adicionar("trabalhando", "O agente está trabalhando. Pedidos longos podem levar um minuto.");
  $("#enviar").disabled = true;
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({mensagens: historico, nome: $("#nome").value, modelo: $("#modelo").value, instrucoes: $("#instrucoes").value})});
    const j = await r.json();
    espera.remove();
    if (j.erro) { adicionar("falha", esc(j.erro)); historico.pop(); return; }
    if (j.passos.length) {
      const passos = j.passos.map((p) => `<div class="passo"><b>${esc(TIPO[p.tipo] || p.tipo)}</b> ${esc(p.ferramenta)}<pre>${esc(JSON.stringify(p.argumentos, null, 1))}</pre><details><summary>Resultado</summary><pre>${esc(p.resultado)}</pre></details></div>`).join("");
      const d = document.createElement("details"); d.className = "passos msg";
      d.innerHTML = `<summary>${j.passos.length} ${j.passos.length === 1 ? "chamada de ferramenta" : "chamadas de ferramenta"}</summary>${passos}`;
      $("#mensagens").append(d);
    }
    adicionar("agente", esc(j.resposta));
    historico.push({role: "assistant", content: j.resposta});
  } catch (_) {
    espera.remove(); adicionar("falha", "A resposta não chegou. Verifique a conexão e tente de novo."); historico.pop();
  } finally { $("#enviar").disabled = false; }
}

$("#form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("#texto").value.trim(); if (!t) return; $("#texto").value = ""; enviar(t); });
$("#texto").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } });
$("#sugestoes").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) enviar(b.textContent); });
$("#nova").addEventListener("click", () => { historico = []; $("#mensagens").querySelectorAll(".msg, details").forEach((n) => n.remove()); });
$("#apagar").addEventListener("click", () => { $("#instrucoes").value = ""; guardar("instrucoes", ""); $("#agente").value = ""; guardar("agente", ""); sugestoes(); });
</script>
</body>
</html>
